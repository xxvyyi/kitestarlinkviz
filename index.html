<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USSF Constellation Prototype</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #050505; color: white; font-family: sans-serif; }
        #ui-panel {
            position: absolute; top: 20px; left: 20px;
            background: rgba(20, 20, 20, 0.8);
            padding: 20px; border-radius: 8px; border: 1px solid #444;
            width: 300px;
        }
        h2 { margin-top: 0; font-size: 1.2rem; }
        .control-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 0.9rem; }
        input[type="range"] { width: 100%; }
        .data-readout { color: #4ade80; font-weight: bold; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="ui-panel">
        <h2>Constellation Planner</h2>
        <div class="control-group">
            <label>Orbital Planes: <span id="planes-val" class="data-readout">12</span></label>
            <input type="range" id="planes-slider" min="1" max="48" value="12">
        </div>
        <div class="control-group">
            <label>Satellites per Plane: <span id="sats-val" class="data-readout">20</span></label>
            <input type="range" id="sats-slider" min="1" max="40" value="20">
        </div>
        <div class="control-group">
            <label>Total Satellites: <span id="total-val" class="data-readout">240</span></label>
        </div>
    </div>

    <script>
        // 1. Scene Setup
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 5;
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 2. Add Earth (Wireframe for clear geography rendering without external images)
        const earthGeometry = new THREE.SphereGeometry(1, 32, 32);
        const earthMaterial = new THREE.MeshBasicMaterial({ color: 0x1e40af, wireframe: true });
        const earth = new THREE.Mesh(earthGeometry, earthMaterial);
        scene.add(earth);

        // 3. Constellation Logic
        let constellationGroup = new THREE.Group();
        scene.add(constellationGroup);

        function generateConstellation(numPlanes, satsPerPlane) {
            // Clear old constellation
            while(constellationGroup.children.length > 0){ 
                constellationGroup.remove(constellationGroup.children[0]); 
            }

            const altitude = 1.3; // Earth radius + orbit height
            const inclination = THREE.MathUtils.degToRad(53); // Standard Starlink inclination

            for (let p = 0; p < numPlanes; p++) {
                const raan = (p / numPlanes) * Math.PI * 2; // Right Ascension of Ascending Node
                
                // Create Orbital Ring (Visual path)
                const ringGeo = new THREE.BufferGeometry().setFromPoints(
                    new THREE.Path().absarc(0, 0, altitude, 0, Math.PI * 2).getSpacedPoints(64)
                );
                const ringMat = new THREE.LineBasicMaterial({ color: 0x444444, transparent: true, opacity: 0.5 });
                const ring = new THREE.Line(ringGeo, ringMat);
                
                // Tilt and rotate the ring
                ring.rotation.x = inclination;
                ring.rotation.y = raan;
                constellationGroup.add(ring);

                // Add Satellites to this plane
                const satGeo = new THREE.SphereGeometry(0.02, 8, 8);
                const satMat = new THREE.MeshBasicMaterial({ color: 0x4ade80 });

                for (let s = 0; s < satsPerPlane; s++) {
                    const trueAnomaly = (s / satsPerPlane) * Math.PI * 2;
                    const sat = new THREE.Mesh(satGeo, satMat);
                    
                    // Position satellite on the ring
                    sat.position.set(Math.cos(trueAnomaly) * altitude, Math.sin(trueAnomaly) * altitude, 0);
                    
                    // Group satellite so it rotates with the plane
                    const satPivot = new THREE.Group();
                    satPivot.rotation.x = inclination;
                    satPivot.rotation.y = raan;
                    satPivot.add(sat);
                    constellationGroup.add(satPivot);
                }
            }
            document.getElementById('total-val').innerText = numPlanes * satsPerPlane;
        }

        // 4. UI Listeners
        const planesSlider = document.getElementById('planes-slider');
        const satsSlider = document.getElementById('sats-slider');

        planesSlider.addEventListener('input', (e) => {
            document.getElementById('planes-val').innerText = e.target.value;
            generateConstellation(parseInt(e.target.value), parseInt(satsSlider.value));
        });

        satsSlider.addEventListener('input', (e) => {
            document.getElementById('sats-val').innerText = e.target.value;
            generateConstellation(parseInt(planesSlider.value), parseInt(e.target.value));
        });

        // Initialize default constellation
        generateConstellation(12, 20);

        // 5. Animation Loop
        function animate() {
            requestAnimationFrame(animate);
            earth.rotation.y += 0.001; // Earth rotation
            constellationGroup.rotation.y += 0.002; // Constellation orbit simulation
            renderer.render(scene, camera);
        }
        animate();

        // Handle window resizing
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
